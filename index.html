<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PAradar – identifiez la plateforme agréée d'un client via Peppol" />
    <title>PAradar</title>
    <meta name="theme-color" content="#0b4f6c" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect x='4' y='4' width='40' height='40' rx='11' fill='%230b4f6c'/><path d='M15 13h12l6 6v16H15z' fill='%23fff'/><path d='M33 9.5a7 7 0 0 1 5.5 5.5M33 5.5a11 11 0 0 1 9.5 9.5' stroke='%23f2b33d' stroke-width='3' stroke-linecap='round' fill='none'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique le thème avant le premier rendu (évite le flash clair → sombre)
      (function () {
        try {
          var t = localStorage.getItem('paradar.theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
