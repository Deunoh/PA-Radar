# Déploiement sur Render (Blueprint) : New + → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: paradar
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "24"
      # L'IP du client arrive dans X-Forwarded-For : nécessaire pour la limite par IP
      - key: TRUST_PROXY
        value: "true"
